<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid #262a35;
      font-weight: 600;
    }
    header small { color: #8b93a7; font-weight: 400; margin-left: 8px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #2f6feb; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #1c2130; }
    .msg.error { align-self: center; background: #3a1d22; color: #ff9aa5; }
    form {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #262a35;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333a4d;
      background: #161a24;
      color: inherit;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #2f6feb; }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #2f6feb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>Chat Mistral <small>mistral-small-latest</small></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Digite sua mensagem…" autocomplete="off" autofocus />
    <button id="send" type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      history.push({ role: "user", content: text });

      const pending = addMessage("assistant", "…");
      send.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erro inesperado.");
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.className = "msg error";
        pending.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
